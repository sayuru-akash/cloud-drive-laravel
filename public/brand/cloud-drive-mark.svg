    <path fill="url(#cloud-drive-ring)" fill-rule="evenodd" filter="url(#cloud-drive-soft-shadow)" d="M32 6a26 26 0 1 1 0 52 26 26 0 0 1 0-52Zm0 12a14 14 0 1 0 0 28 14 14 0 0 0 0-28Z"/>
