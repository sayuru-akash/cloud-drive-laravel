    <defs>
        <linearGradient id="cloud-drive-ring" x1="8" y1="52" x2="56" y2="12" gradientUnits="userSpaceOnUse">
            <stop stop-color="#197a68"/>
            <stop offset="0.48" stop-color="#35c6a0"/>
            <stop offset="1" stop-color="#7c3aed"/>
